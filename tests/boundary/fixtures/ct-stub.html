<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>instrument --browser stub under the shim</title>
  </head>
  <body>
    <p id="status">loading</p>
    <!-- Turn the counting layer on and point the stub at the fixture server
         before the stub runs: it opens its socket while it loads. -->
    <script src="ct-stub.js"></script>
    <!-- The bootstrap stub `codetracer-js-recorder instrument --browser`
         writes, generated by the test. -->
    <script src="/__generated/stub/codetracer-runtime.js"></script>
    <script>
      document.getElementById("status").textContent =
        typeof __ct === "object" && typeof __ct.step === "function"
          ? "running"
          : "missing";
      for (var i = 0; i < 5; i++) __ct.step(i);
    </script>
  </body>
</html>
