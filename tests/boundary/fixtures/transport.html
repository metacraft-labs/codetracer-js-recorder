<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>boundary transport</title>
  </head>
  <body>
    <div id="app">
      <button id="one">One</button>
      <p id="clicks">0</p>
      <button id="burst" data-n="2000">Burst</button>
      <button id="burst-600" data-n="600">Burst 600</button>
      <p id="burst-done"></p>
      <button id="ticks" data-n="150">Ticks</button>
      <p id="ticks-done"></p>
      <button id="steady-slow" data-n="480" data-interval="25" data-done="steady-done">Steady 25 ms</button>
      <button id="steady-fast" data-n="2000" data-interval="5" data-done="steady-done">Steady 5 ms</button>
      <p id="steady-done"></p>
    </div>
    <script src="transport.js"></script>
  </body>
</html>
