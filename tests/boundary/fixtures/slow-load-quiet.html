<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>slow load, quiet</title>
<!--
  A page that is slow to load, for tests/boundary/replay.test.ts
  (replay_reproduces_a_task_that_ran_after_parsing_at_a_held_position). It is
  slow-load.html with listeners that read nothing the log records: the
  pointer's handlers note the document's extent and readyState only, and no
  script reads a clock or a random source. So the page runs nothing between
  one input and the next, and the input after the parse is the first thing
  the replay has to do once the parser has got to the end. Served with
  ?chunks=<ms>, every resource answered late (?delay=<ms>).
-->
<link rel="stylesheet" href="slow-load.css?delay=250">
<script src="slow-load-quiet.js"></script>
<script>note("inline-head");</script>
<script src="slow-load-quiet-late.js?delay=450"></script>
<script defer src="slow-load-quiet-defer.js?delay=900"></script>
</head>
<body>
<h1 id="title">A page that loads slowly</h1>
<!--ct:chunk-->
<section id="first">
  <p>one</p><p>two</p><p>three</p><p>four</p><p>five</p>
  <p>six</p><p>seven</p><p>eight</p><p>nine</p><p>ten</p>
</section>
<script>note("inline-body-1");</script>
<!--ct:chunk-->
<ul id="list">
  <li>a</li><li>b</li><li>c</li><li>d</li><li>e</li><li>f</li><li>g</li>
  <li>h</li><li>i</li><li>j</li><li>k</li><li>l</li><li>m</li><li>n</li>
</ul>
<img src="slow-load-pixel.svg?delay=1300" alt="" width="200" height="40">
<!--ct:chunk-->
<section id="last"><p>the end</p></section>
<script>note("inline-body-2");</script>
</body>
</html>
