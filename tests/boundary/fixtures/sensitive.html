<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sensitive inputs</title>
  </head>
  <body>
    <main>
      <input id="email" type="email" />
      <button id="check" type="button">Check</button>
      <p id="verdict"></p>
      <input id="pw" type="password" />
      <button id="login" type="button">Log in</button>
      <input id="pin" type="text" />
      <button id="go" type="button">Go</button>
      <button id="roll" type="button">Roll</button>
      <p id="status"></p>
      <div id="mirrors">
        <input id="mir" type="text" />
        <textarea id="ta"></textarea>
      </div>
      <div id="ed" contenteditable="true"></div>
      <button id="finish" type="button">Finish</button>
    </main>
    <script src="sensitive.js"></script>
  </body>
</html>
