<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- No 'unsafe-eval': the platform refuses to compile a string timer
         handler. 'unsafe-inline' admits the recorder's inline bootstrap. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-inline'"
    />
    <title>string timer handlers under CSP</title>
  </head>
  <!-- Four string timer calls are refused: setTimeout x3, setInterval x1. -->
  <body data-expect-violations="4">
    <ul id="out"></ul>
    <script src="timers.js"></script>
  </body>
</html>
