name: launcher-integration

# Single-edge cross-repo CI: when codetracer-js-recorder changes,
# verify the launcher's bundled-tarball build still works against
# this recorder's source. Mirrors the pattern in
# codetracer-specs/Testing/Cross-Repo-CI-Integration.md.
#
# ---------------------------------------------------------------------------
# SCOPE: PACKAGING ONLY. **NON-AUTHORITATIVE FOR THE RECORD CONTRACT.**
#
# This workflow asserts exactly one thing about behaviour: that the bundled
# `ct` prints a version matching `^ct [0-9]+\.[0-9]+`. It never runs
# `ct record`, never drives this recorder, and never inspects a produced
# trace, so a change to this recorder's CLI, its exit codes, its output layout
# or its trace format stays GREEN here. That is not hypothetical: `.js` was
# missing from the desktop capability file for the whole life of this
# workflow, so `ct record app.js` could not route AT ALL, and this smoke test
# never noticed.
#
# It is deliberately RETAINED as a fast pre-check: it covers the npm bundling
# path nothing else covers, and it fails in seconds rather than in an hour.
#
# The authority for the launcher <-> recorder RECORD contract is the
# end-to-end gate added by milestone LRC-4, which routes `ct record <sample>`
# through the real launcher into the real desktop core and this real recorder
# and validates the produced CTFS trace with `ct-print`:
#
#   .github/workflows/launcher-recorder-e2e.yml   (this repo's thin caller)
#   cross-repo/launcher-compat.yml                (this repo's contract fixture)
#   metacraft-labs/codetracer/.github/workflows/launcher-recorder-e2e.yml
#   metacraft-labs/codetracer/ci/test/launcher-recorder-e2e.sh
#
# Design: codetracer-specs/Testing/Launcher-Recorder-Compatibility-Tests.md
#         ("Motivation" explains why `ct --version` is not enough; section 6
#         records that these smoke workflows stay as a fast pre-check).
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, dev, stable]
  pull_request:

jobs:
  npm-bundling:
    runs-on: [self-hosted, nixos]
    name: npm bundling smoke-test
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4
        with:
          path: codetracer-js-recorder

      - uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-launcher
          ref: main
          path: codetracer-launcher
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.4"

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build launcher
        working-directory: codetracer-launcher
        run: bash ./build.sh --target linux-musl-x86_64 --out launcher

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build bundled tarball
        working-directory: codetracer-launcher/packaging/npm
        env:
          CT_LAUNCHER_VERSION: 0.1.0
          CT_LAUNCHER_BIN: ${{ github.workspace }}/codetracer-launcher/out/launcher
          CT_LAUNCHER_TARGET: linux-musl-x86_64
          CT_RECORDER_SRC: ${{ github.workspace }}/codetracer-js-recorder/packages
        run: node build_npm.mjs

      - name: Smoke-test the tarball
        run: |
          mkdir -p /tmp/m9-npm && cd /tmp/m9-npm
          npm init -y > /dev/null
          npm install --no-save "${GITHUB_WORKSPACE}/codetracer-launcher/packaging/npm/dist"/*.tgz
          out=$(./node_modules/.bin/ct --version)
          echo "$out"
          echo "$out" | grep -qE "^ct [0-9]+\.[0-9]+"
