name: CI

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  build-and-test:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        # setup-dev-env clones the siblings listed in .github/sibling-repos
        # (codetracer-trace-format, codetracer-trace-format-nim) at the
        # explicit refs used by the flake before materialising the nix env.
        # --impure lets the dev shell pick up CODETRACER_NIM_LIB_DIR from the
        # ambient environment (it defaults to ../codetracer-trace-format-nim).
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          nix-develop-args: --impure

      - name: Build Nim trace writer library
        # The nim+nimble+zstd toolchain comes from the dev shell; zstd is on
        # the dev-shell package set so the cargo/napi build resolves it via
        # pkg-config without an explicit ZSTD_LIB_DIR.
        run: |
          dev-exec bash -c "
            set -euo pipefail
            cd '${GITHUB_WORKSPACE}/../codetracer-trace-format-nim'
            nimble install -y stew results
            nim c --app:staticlib --mm:arc --noMain -d:release --passC:'-fPIC' -p:src \
              -o:libcodetracer_trace_writer.a src/codetracer_trace_writer_ffi.nim
            # Build ct-print so the test helpers can inspect srcviews.dat
            # (recorder_autoformat.test.ts requires it as the canonical
            # oracle since the P6.2 srcviews migration).
            nim c -d:release -o:ct-print src/codetracer_ct_print.nim
          "
          echo "CODETRACER_NIM_LIB_DIR=${GITHUB_WORKSPACE}/../codetracer-trace-format-nim" >> "$GITHUB_ENV"
          echo "CT_PRINT=${GITHUB_WORKSPACE}/../codetracer-trace-format-nim/ct-print" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: dev-exec npm install

      - name: Build native addon
        run: dev-exec just build-native

      - name: Build TypeScript packages
        run: dev-exec npm run build

      - name: Run tests
        run: dev-exec just test

  nix-build:
    name: Verify nix flake packages build
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: Build default package
        run: nix build .#default
