name: CI (reprobuild)

# Additive side-by-side CI run that re-plays the project's
# deterministic dev env through reprobuild instead of `nix develop` or
# `env.ps1`. Runs alongside the existing `ci.yml` (`nix`) and any
# `windows-build.yml` (`windows-diy`) entries so regressions in either
# of the older paths still gate merges — see
# `codetracer-specs/Repo-Requirements.md` §2.9 and
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` §4 for the
# rollout shape.
#
# The `setup-dev-env` composite action accepts `env-flavor: reprobuild`
# (target state per the policy). When the action's reprobuild branch
# lands, this workflow exercises it end-to-end on every supported
# host without any other repo-side change.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  reprobuild:
    name: ${{ matrix.os }} — repro build/test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: [self-hosted, nixos]
          - os: macos
            runner: [self-hosted, aarch64-darwin]
          - os: windows
            runner: [self-hosted, Windows, X64, nixos-equivalent]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Mint a GitHub App installation token via the CI Token Provider
      # app so the reprobuild flake/sibling steps can clone private
      # metacraft-labs repos (codetracer-native-recorder, runquota,
      # repo-workspaces, etc.) and so the workspace-lock checkout below
      # can read metacraft-manifests.  GitHub free plan restricts
      # org-level secrets with visibility ALL from being readable in
      # private repos, so we mint per-run tokens from the app secrets
      # stored at repo level (CI_TOKEN_PROVIDER_APP_ID +
      # CI_TOKEN_PROVIDER_PRIVATE_KEY).
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (reprobuild flavor)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: reprobuild
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: Add xz for reprobuild tool archives
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          xz_out="$(nix build --no-link --print-out-paths nixpkgs#xz.bin)"
          xz_bin="${xz_out}/bin"
          echo "$xz_bin" >> "$GITHUB_PATH"
          "$xz_bin/xz" --version

      - name: Prepare macOS linker paths
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          iconv_out="$(nix build --no-link --print-out-paths nixpkgs#libiconv)"
          echo "LIBRARY_PATH=${iconv_out}/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${iconv_out}/lib${DYLD_LIBRARY_PATH:+:${DYLD_LIBRARY_PATH}}" >> "$GITHUB_ENV"
          echo "NIX_LDFLAGS=-L${iconv_out}/lib${NIX_LDFLAGS:+ ${NIX_LDFLAGS}}" >> "$GITHUB_ENV"
          if [ -z "${SDKROOT:-}" ] && [ -x /usr/bin/xcrun ]; then
            sdkroot="$(/usr/bin/xcrun --sdk macosx --show-sdk-path 2>/dev/null || true)"
            if [ -n "$sdkroot" ]; then
              echo "SDKROOT=$sdkroot" >> "$GITHUB_ENV"
            fi
          fi

      - name: repro build
        # Builds the conventional `build` collection declared in
        # `repro.nim`. Verifies the primary shipping artefact (the
        # recorder binary or extension) materialises through the
        # reprobuild engine identically to `just build`.
        # Linux/macOS use Nix-provisioned Rust tools; generic Rust
        # tarballs do not run directly on NixOS runners.
        run: dev-exec repro build --tool-provisioning=${{ matrix.os == 'windows' && 'path' || 'nix' }} --no-runquota

      - name: repro test
        # Materialises the `test` collection.
        run: dev-exec repro test --tool-provisioning=${{ matrix.os == 'windows' && 'path' || 'nix' }} --no-runquota

      - name: just build (cross-check)
        # Re-runs the legacy `just build` path inside the same env so
        # we catch silent divergences between `repro build` outputs
        # and what the dev shell + Justfile produce today.
        run: dev-exec just build

      - name: just test (cross-check)
        run: dev-exec just test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ matrix.os }}
          path: |
            target/
            .repro/
          retention-days: 7
          if-no-files-found: ignore
