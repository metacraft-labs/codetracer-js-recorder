name: CI (reprobuild)

# Additive side-by-side CI run that re-plays the project's
# deterministic dev env through reprobuild instead of `nix develop` or
# `env.ps1`. Runs alongside the existing `ci.yml` (`nix`) and any
# `windows-build.yml` (`windows-diy`) entries so regressions in either
# of the older paths still gate merges. The rollout keeps every existing
# environment flavour gating while the reprobuild one is added beside it, and
# retires an older flavour only once the reprobuild run is green on every
# host the older one covers.
#
# The `setup-dev-env` composite action accepts `env-flavor: reprobuild`
# (the target flavour for every repository). When the action's reprobuild branch
# lands, this workflow exercises it end-to-end on every supported
# host without any other repo-side change.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reprobuild:
    name: ${{ matrix.os }}-${{ matrix.arch }} — repro build/test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: [self-hosted, linux, x64]
          - os: linux
            arch: arm64
            runner: [self-hosted, linux, arm64]
          - os: macos
            arch: arm64
            runner: [self-hosted, macos, arm64]
          - os: windows
            arch: x64
            runner: [self-hosted, windows, x64]
          - os: windows
            arch: arm64
            runner: [self-hosted, windows, arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Mint a GitHub App installation token via the CI Token Provider
      # app so the reprobuild flake/sibling steps can clone private
      # metacraft-labs repos (codetracer-native-recorder, runquota,
      # repo-workspaces, etc.) and so the workspace-lock checkout below
      # can read metacraft-manifests.  GitHub free plan restricts
      # org-level secrets with visibility ALL from being readable in
      # private repos, so we mint per-run tokens from the app secrets
      # stored at repo level (CI_TOKEN_PROVIDER_APP_ID +
      # CI_TOKEN_PROVIDER_PRIVATE_KEY).
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (reprobuild flavor)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: reprobuild
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          # The job's Nix GitHub credential has to outlive the hour, because
          # this job does. An App installation token expires one hour after
          # it is minted, and on a cold Linux runner setup-dev-env alone takes
          # about that long: it builds the pinned repro from source (~47 min)
          # and then realises the dev env. Without these two inputs
          # setup-dev-env skips its job credential broker, and Nix keeps
          # presenting `gh-token` after it expires. A 401 from an expired
          # token is fatal even for a public tarball. In PR #25's linux-x64 job
          # the token was minted at 14:52:57 and, at 15:52:58, the dev-env
          # evaluation's fetch of the public `nix-community/fenix` tarball got
          # `HTTP error 401 "Bad credentials"`. With the App's id and key the
          # broker re-mints a `contents: read` token before expiry and
          # rewrites the job's credential files in place, so every later
          # `nix` and `repro exec` reads a live token. See the `app-id` input
          # of setup-dev-env. The broker does not run on Windows, so the
          # Windows legs are unaffected.
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          app-private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: repro build
        # Builds the conventional `build` collection declared in
        # `repro.nim`. Verifies the primary shipping artefact (the
        # recorder binary or extension) materialises through the
        # reprobuild engine identically to `just build`.
        run: dev-exec repro build

      - name: repro test
        # Materialises the `test` collection. It also builds ct-print in the
        # sibling `../codetracer-trace-format-nim`, which the vitest suite of
        # `just test (cross-check)` below decodes every recording with:
        # `repro.nim` declares that compile as an edge, through the sibling's
        # own `buildCtPrint` constructor, so the declared C compiler and
        # zstd-dev reach it on every host, Windows included.
        run: dev-exec repro test

      - name: just build (cross-check)
        # Re-runs the legacy `just build` path inside the same env so
        # we catch silent divergences between `repro build` outputs
        # and what the dev shell + Justfile produce today.
        #
        # It is NOT the same cargo build as `repro build` above, and does not
        # reuse it: `npx napi build` (@napi-rs/cli 3) always passes an explicit
        # `--target <host triple>`, which makes cargo build into
        # `target/<triple>/release/`, while the `repro.nim` cargo edge builds
        # `target/release/`. So this step compiles the whole crate graph again
        # from cold, release profile with LTO.
        #
        # Windows: a bound, so a hang fails this leg instead of holding one
        # of the fleet's two Windows slots until the job's 6 h limit. On
        # 2026-11-12 (run 43202169561) this step went silent after `npx napi
        # build` and was cancelled 2 h 18 min later. Sized from the first runs
        # in which napi actually ran (run 44685803773, 2026-11-20): on
        # windows-x64 the step took 16 min 58 s, of which cargo took 11 min
        # 19 s; on windows-arm64 cargo alone took 17 min 51 s and the step
        # hit the previous 20 min bound at 20 min 10 s, during `npm run
        # build`. With the same ~5 min 40 s of npm and tsc work as x64, the
        # arm64 step needs about 24 min, so 45 min is a little under twice the
        # slowest measured leg and still fails a hang within the hour. Linux
        # and macOS keep the job default until a run of theirs gives this
        # step a duration to size from.
        timeout-minutes: ${{ matrix.os == 'windows' && 45 || 360 }}
        run: dev-exec just build

      - name: Build codetracer test binaries
        # The boundary replay tests `just test` runs need `ct-jsbound` and
        # `session-manager` from the codetracer sibling; same recipe as ci.yml.
        run: dev-exec just build-codetracer-test-bins

      - name: just test (cross-check)
        # Linux and Windows: Playwright's browser log goes to one file per
        # Node process under ci-diagnostics/playwright/, which "Upload logs on
        # failure" below collects. It is the only record of why a Chromium
        # page crashed or hung: the test report says just "Page crashed",
        # while this log has the browser's own stderr and its exit code or
        # signal. The preload only points playwright-core's DEBUG_FILE at
        # that directory
        # (see scripts/ci/playwright-debug-log.cjs for why each process needs
        # its own file); `pw:browser*` selects the browser-process channel and
        # nothing else, so stdout and the tests' behaviour are unchanged.
        # Linux and Windows: the browser failures this was added for (run
        # 44685803773) happened on the linux-x64 leg, and a page's record
        # stop that never resolved (run 45834561012, windows-x64) needs the
        # browser's side of the story too. The Windows path has no spaces,
        # and NODE_OPTIONS treats a backslash outside quotes literally, so
        # the unquoted `--require=<path>` is read as written.
        env:
          CT_PLAYWRIGHT_DEBUG_DIR: ${{ (matrix.os == 'linux' || matrix.os == 'windows') && format('{0}/ci-diagnostics/playwright', github.workspace) || '' }}
          DEBUG: ${{ (matrix.os == 'linux' || matrix.os == 'windows') && 'pw:browser*' || '' }}
          NODE_OPTIONS: ${{ (matrix.os == 'linux' || matrix.os == 'windows') && format('--require={0}/scripts/ci/playwright-debug-log.cjs', github.workspace) || '' }}
        run: dev-exec just test

      # Linux: what the runner gave this job, read after a failure. Browser
      # tests passed on NixOS hosts and failed on the ephemeral incus container
      # class at the same commit (run 44685803773: timeouts and "Page crashed"
      # on linux-x64 only), and nothing in the job log says how many CPUs,
      # how much memory, or which cgroup limits the container had. The cgroup
      # counters are cumulative, so memory.events (oom_kill) and pids.events
      # (max) still show a limit that was hit mid-run. Read directly on the
      # runner, not through dev-exec, so it describes the host the tests ran
      # on; every probe tolerates being unreadable, so this step can only add
      # evidence, never a failure of its own.
      - name: Record runner resources on failure
        if: failure() && matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          out=ci-diagnostics/runner-resources.txt
          probe() {
            printf '\n===== %s\n' "$*"
            "$@" 2>&1 || printf '(exit %s)\n' "$?"
          }
          {
            probe uname -a
            probe nproc
            probe free -m
            probe sh -c 'ulimit -a'
            probe df -h /tmp /dev/shm
            probe cat /proc/self/cgroup
            # cgroup v2: the files of this process's cgroup and of each
            # ancestor visible in the namespace, since a limit may be set
            # on any of them.
            rel="$(sed -n 's/^0:://p' /proc/self/cgroup)"
            dir="/sys/fs/cgroup${rel%/}"
            while :; do
              for f in memory.max memory.high memory.current memory.peak \
                memory.events pids.max pids.current pids.peak pids.events \
                cpu.max cpu.weight cpuset.cpus.effective; do
                if [ -r "$dir/$f" ]; then probe cat "$dir/$f"; fi
              done
              case "$dir" in /sys/fs/cgroup/?*) dir="${dir%/*}" ;; *) break ;; esac
            done
            probe cat /proc/loadavg
            probe cat /proc/sys/kernel/pid_max /proc/sys/kernel/threads-max
            probe sh -c 'dmesg | tail -n 200'
          } > "$out" 2>&1 || true
          cat "$out"

      # Diagnostics on failure. Three things below are load-bearing:
      #
      # 1. `include-hidden-files: true`. actions/upload-artifact@v4 defaults this
      #    input to false, and @actions/glob then skips any entry it traverses whose
      #    own basename starts with "." (internal-globber.ts:
      #    `if (options.excludeHiddenFiles && path.basename(item.path).match(/^\./))
      #    continue`). The old `path: .repro/` made `.repro` itself the search root,
      #    so it was skipped outright and this step logged
      #      "No files were found with the provided path: target/ .repro/"
      #    which `if-no-files-found: ignore` then swallowed. Net effect: the build
      #    engine's per-action stdio captures -- `<outDir>/build-engine-cache/
      #    actions/<actionId>.stderr.log`, see repro_build_engine.nim -- have never
      #    been uploaded from any leg of this workflow, on any platform.
      # 2. Narrow paths. A whole `.repro/` tree measures ~1.1 GiB (dominated by
      #    build-engine-cache/monitor-depfiles and dependency-evidence); the failure
      #    report plus the per-action logs are ~600 KiB. `target/` was dropped: it is
      #    a build-output tree rather than a log tree, it matches nothing in the Nim
      #    repos, and where it does match it would permanently mask the warning below.
      # 3. `if-no-files-found: warn` (the action's own default). This step only runs
      #    on failure, so a warning costs nothing -- and it is exactly what would have
      #    surfaced (1) years ago instead of hiding it behind a green step.
      #
      # Context, 2026-09: no leg of this workflow is green on ANY platform. Census of
      # the job records: linux-x64 77 failure / 19 cancelled / 0 success, linux-arm64
      # 77/19/0, macos-arm64 75/25/0, windows-x64 61/35/0. The only two successes on
      # record are from 2026-07-06, under the pre-rename job names. The arm64 leg
      # fails earlier than x64, and x64 fails for an unrelated project-level reason
      # (`cannot open file: results`, codetracer_ct_print.nim(24, 8)). These
      # artifacts are the only way to find out why any of it actually fails.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .repro/build/*/build-failure-report.json
            .repro/build/*/build-engine-cache/actions/
            ci-diagnostics/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn

      - name: Mirror test logs to S3 (non-blocking)
        if: failure()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: target/
          prefix: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}/${{ github.run_id }}/target
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

      - name: Mirror reprobuild logs to S3 (non-blocking)
        if: failure()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: .repro/
          prefix: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}/${{ github.run_id }}/repro
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}
